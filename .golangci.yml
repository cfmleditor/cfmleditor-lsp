version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - godox
    - gocritic
    - gosec
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nlreturn
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wsl_v5
  settings:
    gocritic:
      # On top of gocritic's default checks: every check tagged performance,
      # and two that keep the code honest. The copy thresholds are gocritic's
      # own default of 80 bytes; every copy at or above it was removed when
      # these were enabled, and the checks keep new ones out. When a copy is the
      # point (appending the value to a result, keeping a private copy of
      # options it then edits), take it explicitly with *p rather than
      # suppressing the check.
      #
      # whyNoLint wants a reason on every //nolint. emptyStringTest prefers
      # s == "" to len(s) == 0.
      enabled-checks:
        - appendCombine
        - equalFold
        - hugeParam
        - indexAlloc
        - preferDecodeRune
        - preferFprint
        - preferStringWriter
        - preferWriteByte
        - rangeExprCopy
        - rangeValCopy
        - sliceClear
        - stringXbytes
        - zeroByteRepeat
        - whyNoLint
        - emptyStringTest
      settings:
        hugeParam:
          sizeThreshold: 80
        rangeValCopy:
          sizeThreshold: 80
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - prealloc
          - unparam
          - gosec
          - staticcheck
      - linters:
          - gosec
        text: "G104|G115|G204|G301|G302|G304|G306|G703"
      - linters:
          - godox
        text: "TODO"
