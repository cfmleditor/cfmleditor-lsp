version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
    - bodyclose
    - nilerr
    - copyloopvar
    - durationcheck
    - errorlint
    - makezero
    - prealloc
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - prealloc
          - unparam
