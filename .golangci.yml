version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - godox
    - gocritic
    - gosec
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nlreturn
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wsl_v5
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - prealloc
          - unparam
          - gosec
          - staticcheck
      - linters:
          - gosec
        text: "G104|G115|G204|G301|G302|G304|G306|G703"
      - linters:
          - godox
        text: "TODO"
