version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - depguard
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - godox
    - gosec
    - ineffassign
    - iotamixing
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - wsl_v5
  settings:
    # Stage 4 (LINT-PLAN.md). New code stays under these; each function over
    # one today carries a //nolint naming the stage, and nolintlint fails on a
    # marker the function no longer needs, so that list only shrinks.
    gocognit:
      min-complexity: 50
    nestif:
      min-complexity: 10
    funlen:
      # Statements, not lines: much of this code is commented at length.
      lines: -1
      statements: 80
      ignore-comments: true
    depguard:
      # Package boundaries CLAUDE.md states in prose. Each matched the import
      # graph when it went in.
      rules:
        parser-stays-light:
          # The parser is kept dependency-light: internal/docs alone is a
          # 6,582-line generated file with an init().
          list-mode: lax
          files: ["**/internal/parser/**", "!$test"]
          deny:
            - pkg: github.com/cfmleditor/cfmleditor-lsp/internal
              desc: internal/parser imports no project package but internal/log
          allow:
            - github.com/cfmleditor/cfmleditor-lsp/internal/log
        server-importers:
          files: ["**/internal/**", "!**/internal/daemon/**", "!**/internal/server/**"]
          deny:
            - pkg: github.com/cfmleditor/cfmleditor-lsp/internal/server
              desc: only internal/daemon and cmd import the server
        store-is-cli-only:
          # Keeps SQLite out of the server and the wasm build.
          files: ["**/internal/**", "!**/internal/codemap/mcp/**", "!**/internal/codemap/store/**"]
          deny:
            - pkg: github.com/cfmleditor/cfmleditor-lsp/internal/codemap/store
              desc: only cmd imports the code-map store
            - pkg: github.com/cfmleditor/cfmleditor-lsp/internal/codemap/mcp
              desc: only cmd imports the MCP server
    forbidigo:
      # Scoped to internal/ below. stdout is the LSP channel there, and one
      # stray print corrupts the protocol.
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: stdout carries the protocol; log, or write to an io.Writer the caller passes
    govet:
      # On top of go vet's default analyzers. Each found nothing when enabled
      # (LINT-PLAN.md, stage 1). shadow and fieldalignment stay off: see there.
      enable:
        - atomicalign
        - deepequalerrors
        - httpmux
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite
    revive:
      # Naming a rule here replaces revive's default set rather than adding to
      # it, so the defaults are listed first and must stay listed.
      rules:
        # revive's defaults.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        # Bug-catchers beyond the defaults (LINT-PLAN.md, stage 1).
        - name: atomic
        - name: constant-logical-expr
        - name: forbidden-call-in-wg-go
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-conditions
        - name: inefficient-map-lookup
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: range-val-address
        - name: range-val-in-closure
        - name: string-of-int
        - name: struct-tag
        - name: time-equal
        - name: unconditional-recursion
        - name: unnecessary-if
        - name: useless-break
        - name: waitgroup-by-value
        # Stage 5 (LINT-PLAN.md): style that costs nothing today. Map style is
        # left unset: both spellings are in use, and picking one is 54 or 139
        # edits that change nothing at runtime. Slice style is "literal", not
        # "nil": a nil slice marshals to null and an empty one to [], and LSP
        # responses and the code-map output rely on [].
        - name: use-any
        # Stage 6 (LINT-PLAN.md): added by revive v1.17.0 (golangci-lint
        # v2.14.0). Found nothing; a marshal method on the wrong receiver is
        # silently never called.
        - name: marshal-receiver
        # An if-init that wraps defeats the idiom, which exists for one-liners;
        # hoist the statement above the if instead.
        - name: multiline-if-init
        - name: enforce-slice-style
          arguments: ["literal"]
        # Stage 2 (LINT-PLAN.md).
        - name: bool-literal-in-expr
        - name: confusing-results
        - name: import-shadowing
        - name: redundant-import-alias
        - name: unchecked-type-assertion
          # `v, _ := x.(T)` cannot panic: a wrong type leaves the zero value
          # and the check after it fails. Only the single-value form is flagged.
          arguments:
            - acceptIgnoredAssertionResult: true
    dupword:
      # Only the words people type twice by accident. Checking every word
      # flags deliberate repetition: "every alternative that matches matches
      # at 0", or a test feeding "getData getData" to an identifier scanner.
      keywords: ["the", "a", "an", "and", "to", "of", "in", "is", "it", "for", "that", "be", "on", "as"]
    thelper:
      # Every *testing.B function here is a body handed to testing.Benchmark
      # by a scaling test, not a helper; b.Helper() in one means nothing.
      benchmark:
        first: false
        name: false
        begin: false
    staticcheck:
      # Every check, the style and simplification ones included; the default
      # set leaves several off.
      checks: ["all"]
    gocritic:
      # On top of gocritic's default checks: every check tagged performance,
      # and two that keep the code honest. The copy thresholds are gocritic's
      # own default of 80 bytes; every copy at or above it was removed when
      # these were enabled, and the checks keep new ones out. When a copy is the
      # point (appending the value to a result, keeping a private copy of
      # options it then edits), take it explicitly with *p rather than
      # suppressing the check.
      #
      # whyNoLint wants a reason on every //nolint. emptyStringTest prefers
      # s == "" to len(s) == 0.
      enabled-checks:
        - appendCombine
        - equalFold
        - hugeParam
        - indexAlloc
        - preferDecodeRune
        - preferFprint
        - preferStringWriter
        - preferWriteByte
        - rangeExprCopy
        - rangeValCopy
        - sliceClear
        - stringXbytes
        - zeroByteRepeat
        - whyNoLint
        - emptyStringTest
        # Bug-catchers that are off by default because gocritic tags them
        # experimental or opinionated. Each found nothing when enabled; they
        # guard new code (LINT-PLAN.md, stage 1).
        - badLock
        - badSyncOnceFunc
        - syncMapLoadAndDelete
        - exposedSyncMutex
        - badSorting
        - sortSlice
        - stringsCompare
        - truncateCmp
        - returnAfterHttpError
        - sqlQuery
        - httpNoBody
        - externalErrorReassign
        - uncheckedInlineErr
        - nilValReturn
        - evalOrder
        - dynamicFmtString
        - badRegexp
        - regexpPattern
        - deferUnlambda
        - sloppyReassign
        # Stage 5 (LINT-PLAN.md): style checks that found nothing when enabled.
        - boolExprSimplify
        - builtinShadow
        - builtinShadowDecl
        - commentedOutImport
        - docStub
        - dupImport
        - dupOption
        - emptyDecl
        - emptyFallthrough
        - hexLiteral
        - initClause
        - methodExprCall
        - octalLiteral
        - preferFilepathJoin
        - ptrToRefParam
        - redundantSprint
        - regexpSimplify
        - stringConcatSimplify
        - timeExprSimplify
        - todoCommentWithoutDetail
        - tooManyResultsChecker
        - typeAssertChain
        - typeUnparen
        - unlabelStmt
        - unnecessaryBlock
        - unnecessaryDefer
        - yodaStyleExpr
        # Stage 2 (LINT-PLAN.md).
        - deferInLoop
        - filepathJoin
        - importShadow
      settings:
        hugeParam:
          sizeThreshold: 80
        rangeValCopy:
          sizeThreshold: 80
  exclusions:
    rules:
      # The code-map store's queries have no context to take: none of its
      # callers holds one. The MCP server's tool handlers take none, and the
      # CLI and the server's background job would pass context.Background().
      # Threading a parameter through every query to carry that is noise;
      # noctx stays on for every other package.
      - path: internal/codemap/store/
        linters:
          - noctx
      # forbidigo guards the LSP's stdout; the CLI under cmd/ prints by
      # design, and a test's stdout is not the protocol (make visualtest
      # prints on purpose).
      - path-except: ^internal/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - prealloc
          - unparam
          - gosec
          - staticcheck
          # SELECT * in a test is a CFML fixture fed to the formatter, not a
          # query this code runs.
          - unqueryvet
      - linters:
          - gosec
        text: "G104|G115|G204|G301|G302|G304|G306|G703"
      - linters:
          - godox
        text: "TODO"
