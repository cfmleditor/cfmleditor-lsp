name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch cfdocs
        shell: bash
        run: ./scripts/fetch-docs-cfdocs.sh

      - name: Generate built-in entries
        run: go run scripts/generate_docs.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "cfmleditor-lsp${ext}" ./cmd/cfmleditor-lsp

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip cfmleditor-lsp.exe
          else
            tar czf cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz cfmleditor-lsp
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip
