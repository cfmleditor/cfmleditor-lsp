name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch cfdocs
        run: ./scripts/fetch-docs-cfdocs.sh

      - name: Generate built-in entries
        run: go run scripts/generate_docs.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "cfmleditor-lsp${ext}" ./cmd/cfmleditor-lsp

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip cfmleditor-lsp.exe
          else
            tar czf cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz cfmleditor-lsp
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip
