name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            zig_target: aarch64-macos
          - goos: darwin
            goarch: amd64
            zig_target: x86_64-macos
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goto-bus-stop/setup-zig@v2

      - name: Fetch and assemble docs sources
        run: make docs

      - name: Verify both docs sources were staged
        run: |
          for src in docs/src/cfdocs docs/src/lucee; do
            if [ ! -d "$src" ]; then
              echo "::error::$src was not staged — released binaries would be missing that source's entries"
              exit 1
            fi
          done

      - name: Generate built-in entries
        run: go run scripts/generate_docs.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: zig cc -target ${{ matrix.zig_target }}
          CXX: zig c++ -target ${{ matrix.zig_target }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "cfmleditor-lsp${ext}" ./cmd/cfmleditor-lsp

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip cfmleditor-lsp.exe
          else
            tar czf cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz cfmleditor-lsp
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            cfmleditor-lsp-${{ matrix.goos }}-${{ matrix.goarch }}.zip
