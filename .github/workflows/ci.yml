name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The generated CFML docs (internal/docs/generated_docs.go) are committed,
      # so nothing here needs `make docs` and its network fetches.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # -short skips the wall-clock threshold tests (TestParsePerformance,
      # TestResolverRegexNotRecompiledPerCall). They assert microsecond budgets
      # that a shared runner cannot meet, so including them would make CI red
      # regardless of the change under test. Run the suite without -short
      # locally to measure performance.
      - name: Test
        run: go test -short ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The server's config loading is concurrent (initialize spawns the
      # workspace index and the linter), so this is worth its own job.
      - name: Test with -race
        run: go test -short -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make lint` rather than golangci-lint-action, for the same reason the
      # vuln job below runs `make vuln`: one pinned version, shared by CI, the
      # release gate and a developer's machine, so they cannot drift apart and
      # report different findings on the same code.
      #
      # It also sidesteps a failure that has nothing to do with the code under
      # test. golangci-lint refuses to load a config whose module targets a
      # newer Go than the linter binary was itself built with, and released
      # binaries lag the Go release by weeks — so every Go bump here is a
      # coin toss on whether the published binary can start at all. The
      # Makefile builds it from source under this module's own toolchain,
      # where the mismatch cannot happen.
      #
      # What this gives up is the action's inline PR annotations: findings
      # appear in the job log rather than on the diff.
      - name: Run golangci-lint
        run: make lint

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make vuln` rather than an action, so this matches exactly what
      # `make release` gates on and what a developer runs locally. Like the
      # jobs above it needs no `make docs`, since generated_docs.go is
      # committed — the scan does not depend on cfdocs or docs.lucee.org
      # being reachable.
      - name: Run govulncheck
        run: make vuln

  perf:
    name: Performance (informational)
    runs-on: ubuntu-latest
    # Never gates a merge. The threshold tests assert microsecond budgets that a
    # shared runner cannot reliably meet — the CI workflow removed in May failed
    # on exactly one of them (TestResolverRegexNotRecompiledPerCall) on every
    # run, and was deleted rather than fixed. So this job publishes numbers to
    # the run summary and always exits 0; continue-on-error is belt and braces.
    # Read it by comparing runs, not by whether it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Deliberately no -short here: this is the one place the timing tests and
      # benchmarks that CI otherwise skips actually run.
      - name: Timing tests and benchmarks
        run: |
          {
            echo '## Performance'
            echo
            echo 'Advisory only — this job never fails. Thresholds are tight enough that a'
            echo 'shared runner trips them regardless of the change under test, so compare'
            echo 'these numbers against previous runs rather than reading pass/fail.'
            echo
            echo '### Threshold tests'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # -count=1 defeats the test cache: a cached "ok" would report a
          # measurement that never ran.
          go test -count=1 -run 'TestParsePerformance|TestResolverRegexNotRecompiledPerCall' \
            ./internal/parser/ ./internal/server/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          {
            echo '```'
            echo
            echo '### Benchmarks'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          go test -bench . -benchtime 100x -run '^$' ./internal/parser/ 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"
