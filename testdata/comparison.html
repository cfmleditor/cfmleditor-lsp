<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML LSP Comparison</title>
</head>
<body>
    <!-- Tag completion: type < to see tag suggestions -->
    <div class="container">
        <!-- Attribute completion: cursor inside a tag after space -->
        <input type="text" name="username" placeholder="Enter name">

        <!-- Closing tag completion: type </ to see suggestions -->
        <ul>
            <li>Item one</li>
            <li>Item two</li>
        </ul>

        <!-- Nested tags -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alpha</td>
                    <td>100</td>
                </tr>
            </tbody>
        </table>

        <!-- Void/self-closing tags -->
        <br>
        <hr>
        <img src="photo.jpg" alt="A photo">

        <!-- Conditional structure (no equivalent in HTML, but for layout comparison) -->
        <div class="if-block">
            <p>Visible content</p>
        </div>
    </div>
</body>
</html>
